name: News update

# 全球新闻(news)：中/意/法/英/日/欧盟/卫报/纽时等 12 家报刊
# 国际新闻非实时性，保持每天 3 次（热点已拆到 hot.yml 每 2 小时）
# 每天意大利（CEST, UTC+2）06:05 / 12:05 / 18:05 各跑一次（分钟错峰，降低与其它模块并发 push 冲突）
on:
  schedule:
    - cron: "5 4,10,16 * * *"
  workflow_dispatch:  # 允许在 Actions 标签手动触发一次

# 允许 GITHUB_TOKEN 把生成结果推送回仓库
permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git for push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git

      # 生成前先拉取最新代码，避免在本旧提交上生成导致与后续 push 冲突
      - name: Pull latest before generate
        run: git pull --rebase origin main || true

      - name: Generate 全球新闻
        run: |
          cd generators
          python gen_hotnews.py news
          cd ..

      - name: Commit and push (news)
        run: bash sync.sh news news
