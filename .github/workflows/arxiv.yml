name: arXiv update

# arXiv 物理最新论文
# 每天意大利（CEST, UTC+2）08:15 / 14:15 / 20:15 各跑一次（分钟错峰，降低与其它模块并发 push 冲突）
#
# ⚠️ 为什么用 self-hosted macOS runner：
#   arXiv/Fastly 在 2026 起对 GitHub Actions 的 Azure 出口 IP 针对性返回 HTTP 406（内容协商拦截），
#   与请求头无关（实测轮换浏览器 UA 仍 406）。本机 Mac mini 的 IP 干净、同款请求均返回 200，
#   故 arxiv 抓取必须跑在 Mac mini 上（需在本机一次性注册 self-hosted runner，见仓库说明）。
#   其它模块（news/rss/hot 等）不受影响，仍跑 ubuntu-latest。
on:
  schedule:
    - cron: "15 6,12,18 * * *"
  workflow_dispatch:  # 允许在 Actions 标签手动触发一次

# 允许 GITHUB_TOKEN 把生成结果推送回仓库
permissions:
  contents: write

jobs:
  arxiv:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git for push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git

      # 生成前先拉取最新代码，避免在本旧提交上生成导致与后续 push 冲突
      - name: Pull latest before generate
        run: git pull --rebase origin main || true

      - name: Generate arXiv physics
        run: |
          cd generators
          python gen_arxiv_physics.py
          cd ..

      - name: Commit and push (arxiv)
        run: bash sync.sh arxiv arxiv-physics
